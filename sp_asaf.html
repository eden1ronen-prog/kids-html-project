<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>איזה גיבור על אתה?</title>

<style>

body{
    font-family:Arial, sans-serif;
    text-align:center;
    background:#eaf6ff;
    padding:20px;
}

#question{
    font-size:28px;
    margin-bottom:20px;
}

button{
    padding:12px 20px;
    margin:8px;
    font-size:18px;
    cursor:pointer;
    border-radius:10px;
}

.answer{
    display:block;
    margin:10px auto;
}

.heroImage{
    width:300px;
    border-radius:20px;
}

.powerImages{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:20px;
}

.powerImages img{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:15px;
}

.restart{
    margin-top:30px;
    font-size:20px;
}

</style>

</head>
<body>

<h1>🦸 איזה גיבור על אתה? 🦸</h1>

<div id="game"></div>

<script>

/* =====================================================
   אזור 1 - הגיבורים
   הילדים יכולים לשנות שמות, תמונות וכוחות
   ===================================================== */

let heroes = {


fire:{
name:"טבח🧑‍🍳",
image:"https://magnivli.co.il/wp-content/uploads/2025/02/1000070870.jpg",
power1:"https://supershine.co.il/wp-content/uploads/2026/02/%D7%98%D7%91%D7%97-%D7%9E%D7%97%D7%99%D7%99%D7%9A-%D7%90%D7%93%D7%95%D7%9D-%D7%AA%D7%97%D7%A4%D7%95%D7%A9%D7%95%D7%AA-%D7%A1%D7%95%D7%A4%D7%A8-%D7%A9%D7%99%D7%99%D7%9F.png",
power2:"https://d3m9l0v76dty0.cloudfront.net/system/photos/11277824/original/01f631ada01e621b98951c10925e14fa.png",
description:"אתה טבח (גרוע)."
},

ice:{
name:"רופא 🏥",
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRoEcOgcKU3rzfuxFMNmPD_7dNjxLjg1fj7ww&s",
power1:"https://img.haarets.co.il/bs/0000018e-be56-d871-ad9e-ff5e3e600000/be/6d/fc544bb0468482b0ad59d8c10872/804180-6.jpg?precrop=2400,1395,x0,y0&width=420&height=244&cmsprod",
power2:"https://www.infomed.co.il/get-image?f=articles/6698/&i=stuffy%20nose-min%20729.jpg.jpg",
description:"יודע לרפות אנשים (אתה לא)."
},

lightning:{
name:"💩 טימטום",
image:"https://pbs.twimg.com/media/ERFZekIXsAIGvsU.png",
power1:"https://f4.bcbits.com/img/a1264738478_5.jpg",
power2:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRCMTi9DxsoJwJdEhtIXUqIVPzAYZSiz4fWdA&s",
description:"לא יודע כלום."
}

};


/* =====================================================
   אזור 2 - שאלות
   ===================================================== */

let questions = [

{
q:"מה אתה אוהב?",
answers:[
["טבח 🧑‍🍳","fire"],
["רופא 🏥","ice"],
["להיות טימטום אחד גדול 💩","lightning"]
]
},

{
q:" אתה אוהב אוכל איזה אוכל אתה אוהב?😋",
answers:[
["סושי 🍱","fire"],
["בננה 🍌","ice"],
["עוגייה 🍪","lightning"]
]
},

{
q:"מה אתה באמת אוהב?",
answers:[
["טבח 🧑‍🍳","fire"],
["רופא 🏥","ice"],
["טימטום 💩","lightning"]
]
}

];


/* =====================================================
   משתני משחק
   ===================================================== */

let fire;
let ice;
let lightning;
let step;


/* =====================================================
   התחלת משחק
   ===================================================== */

function startGame(){

fire = 0;
ice = 0;
lightning = 0;

step = 0;

showQuestion();

}


/* =====================================================
   הצגת שאלה
   ===================================================== */

function showQuestion(){

let q = questions[step];

let html = `
<div id="question">${q.q}</div>
`;

for(let i=0;i<q.answers.length;i++){

html += `
<button class="answer"
onclick="choose('${q.answers[i][1]}')">
${q.answers[i][0]}
</button>
`;

}

document.getElementById("game").innerHTML = html;

}


/* =====================================================
   בחירת תשובה
   ===================================================== */

function choose(type){

if(type=="fire"){
fire++;
}

if(type=="ice"){
ice++;
}

if(type=="lightning"){
lightning++;
}

step++;

if(step < questions.length){

showQuestion();

}
else{

showResult();

}

}


/* =====================================================
   הצגת תוצאה
   ===================================================== */

function showResult(){

let winner = "fire";

if(ice > fire && ice > lightning){
winner = "ice";
}

if(lightning > fire && lightning > ice){
winner = "lightning";
}

let hero = heroes[winner];

document.getElementById("game").innerHTML =

`
<h2>🎉אתה לא גיבור:</h2>

<h1>${hero.name}</h1>

<img class="heroImage"
src="${hero.image}">

<h3>${hero.description}</h3>

<h2>הדברים החלשים שלך</h2>

<div class="powerImages">

<img src="${hero.power1}">

<img src="${hero.power2}">

</div>

<button class="restart"
onclick="startGame()">
 חחזזררהה ללההתתחחללהה 🌍🚧
</button>
`;

}


/* =====================================================
   התחלת המשחק בעת פתיחת הדף
   ===================================================== */

startGame();

</script>

</body>
</html>
