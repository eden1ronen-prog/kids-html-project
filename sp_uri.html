<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>איזה גיבור על אתה?</title>

<style>

body{
    font-family:Arial, sans-serif;
    text-align:center;
    background:#eaf6ff;
    padding:20px;
}

#question{
    font-size:28px;
    margin-bottom:20px;
}

button{
    padding:12px 20px;
    margin:8px;
    font-size:18px;
    cursor:pointer;
    border-radius:10px;
}

.answer{
    display:block;
    margin:10px auto;
}

.heroImage{
    width:300px;
    border-radius:20px;
}

.powerImages{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:20px;
}

.powerImages img{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:15px;
}

.restart{
    margin-top:30px;
    font-size:20px;
}

</style>

</head>
<body>

<h1>🦸 איזה גיבור על אתה? 🦸</h1>

<div id="game"></div>

<script>

/* =====================================================
   אזור 1 - הגיבורים
   הילדים יכולים לשנות שמות, תמונות וכוחות
   ===================================================== */

let heroes = {


fire:{
name:"השינובי של קפר קונוה  🥷",
image:"https://preview.redd.it/how-strong-is-baryon-mode-v0-035e7y3uq5tc1.jpeg?auto=webp&s=b343379a4a5fe046387dfb9f718af9cbbb5537a9",
power1:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR1hvzAXiRZx8tTP0ghuYE6yr7jCvtImrhJbw&s",
power2:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQUzFInFMjtcnKu34tmbyfGntTaZ46CE3WSyQ&s",
description:"יכל לאסות הכול ויש לו את כל הקוחות."
},

ice:{
name:"איש מחתי הקרך הקטלני ❄️",
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR-QHehw1Ber9E87Z97uuW2qLEtYcbWybJHFQ&s",
power1:"https://i.ytimg.com/vi/OCCSoqSEExM/maxresdefault.jpg",
power2:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRRL8hOWhPNSELRpFuwzmKtboIGXxeUTy3GUA&s",
description:"שולט בקרח."
},

lightning:{
name:"שינובי הברקים ⚡",
image:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7loE8ALARNyM-xwPOshi3hW7PBcBFKzADuA&s",
power1:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQa9OXhmqX0wpMz-Tp9DIfl-2N2MD58WW3H_g&s",
power2:"https://preview.redd.it/how-was-kakashi-able-to-use-perfect-susanoo-without-having-v0-1bnlxwlmzanb1.png?width=602&format=png&auto=webp&s=319d80b27947a8fd083a53205528ce3ce897743d",
description:"שולט בברקים."
}

};


/* =====================================================
   אזור 2 - שאלות
   ===================================================== */

let questions = [

{
q:"מה מזג האוויר האהוב עליך?",
answers:[
["יום חם 🔥","fire"],
["יום מושלג ❄️","ice"],
["סערת ברקים ⚡","lightning"]
]
},

{
q:"איזה כוח היית רוצה לקבל?",
answers:[
["ליצור אש","fire"],
["להקפיא דברים","ice"],
["לשלוט בחשמל","lightning"]
]
},

{
q:"איך היית נלחם בנבל?",
answers:[
["כדור אש","fire"],
["מלכודת קרח","ice"],
["מכת ברק","lightning"]
]
}

];


/* =====================================================
   משתני משחק
   ===================================================== */

let fire;
let ice;
let lightning;
let step;


/* =====================================================
   התחלת משחק
   ===================================================== */

function startGame(){

fire = 0;
ice = 0;
lightning = 0;

step = 0;

showQuestion();

}


/* =====================================================
   הצגת שאלה
   ===================================================== */

function showQuestion(){

let q = questions[step];

let html = `
<div id="question">${q.q}</div>
`;

for(let i=0;i<q.answers.length;i++){

html += `
<button class="answer"
onclick="choose('${q.answers[i][1]}')">
${q.answers[i][0]}
</button>
`;

}

document.getElementById("game").innerHTML = html;

}


/* =====================================================
   בחירת תשובה
   ===================================================== */

function choose(type){

if(type=="fire"){
fire++;
}

if(type=="ice"){
ice++;
}

if(type=="lightning"){
lightning++;
}

step++;

if(step < questions.length){

showQuestion();

}
else{

showResult();

}

}


/* =====================================================
   הצגת תוצאה
   ===================================================== */

function showResult(){

let winner = "fire";

if(ice > fire && ice > lightning){
winner = "ice";
}

if(lightning > fire && lightning > ice){
winner = "lightning";
}

let hero = heroes[winner];

document.getElementById("game").innerHTML =

`
<h2>🎉 הגיבור שאתה הוא:</h2>

<h1>${hero.name}</h1>

<img class="heroImage"
src="${hero.image}">

<h3>${hero.description}</h3>

<h2>הכוחות שלך</h2>

<div class="powerImages">

<img src="${hero.power1}">

<img src="${hero.power2}">

</div>

<button class="restart"
onclick="startGame()">
🔄 חזרה להתחלה
</button>
`;

}


/* =====================================================
   התחלת המשחק בעת פתיחת הדף
   ===================================================== */

startGame();

</script>

</body>
</html>
